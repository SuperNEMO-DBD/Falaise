# GEOMETRY VARIANTS TAG 4.0
#

[urn="urn:snemo:demonstrator:geometry:variants:4.0" category="varregistry"]
  description : string = "SuperNEMO demonstrator geometry variants setup (tag 4.0) for geometry setup"


