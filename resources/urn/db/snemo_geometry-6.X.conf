# GEOMETRY VARIANTS SERVICE TAG 4.0
#

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:basic-1.0" category="varprofile"]
  description              : string    = "Basic layout (1.0) variant profile for the SuperNEMO demonstrator geometry"

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:default" category="varprofile"]
  description              : string    = "Default variant profile for the SuperNEMO demonstrator geometry"
  topics                   : string[1] = "alias_of"
  topic.alias_of.component : string    = "urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:basic-1.0"

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0" category="varservice"]
  description : string = "SuperNEMO demonstrator geometry variants service (tag 4.0)"
  topics : string[3] = "registries" "profiles" "defprofile"
  topic.registries.components : string[1]= \
     "urn:snemo:demonstrator:geometry:variants:4.0"
  topic.profiles.components  : string[1] = \
    "urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:basic-1.0"
  topic.defprofile.component : string = \
    "urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:default"


