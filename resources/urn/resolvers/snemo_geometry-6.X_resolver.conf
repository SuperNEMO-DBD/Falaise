# VARIANTS TAG 4.0

[urn="urn:snemo:demonstrator:geometry:variants:4.0" category="configuration"]
  #@config Main configuration file for variants tag 4.0 and the SuperNEMO demonstrator geometry model
  path : string = "@falaise:snemo/demonstrator/geometry/variants/4.0/GeometryVariants.conf"
  mime : string = "text/bayeux.datatools.properties"

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0" category="configuration"]
  #@config Main configuration file for variants tag 4.0 and the SuperNEMO demonstrator geometry model
  path : string = "@falaise:snemo/demonstrator/geometry/variants/service/4.0/GeometryVariantRepository.conf"
  mime : string = "text/bayeux.datatools.properties"

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:basic-1.0" category="configuration"]
  #@config Basic layout 1.0 variant profile variants tag 4.0 and the SuperNEMO demonstrator geometry model 
  path : string = "@falaise:snemo/demonstrator/geometry/variants/service/4.0/profiles/basic-1.0.profile"
  mime : string = "text/bayeux.datatools.configuration.variant"

[urn="urn:snemo:demonstrator:geometry:variants:service:4.0:profiles:default" category="configuration"]
  #@config Default variant profile for variants tag 4.0 and the SuperNEMO demonstrator geometry model 
  path : string = "@falaise:snemo/demonstrator/geometry/variants/service/4.0/profiles/basic-1.0.profile"
  mime : string = "text/bayeux.datatools.configuration.variant"


