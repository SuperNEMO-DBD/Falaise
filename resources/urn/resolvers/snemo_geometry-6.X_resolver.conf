# TAG 6.0

[urn="urn:snemo:demonstrator:geometry:6.0" category="configuration"]
  #@config Main configuration file of the SuperNEMO demonstrator geometry tag 6.0
  path : string = "@falaise:snemo/demonstrator/geometry/6.0/GeometryManager.conf"
  mime : string = "text/bayeux.datatools.properties"

[urn="urn:snemo:demonstrator:geometry:6.0:services" category="configuration"]
