#@description URN to config file resolver lookup table for decay generator
#@key_label  "urn"
#@meta_label "category"

####################
# VARIANTS TAG 3.0

[urn="urn:snemo:demonstrator:decays:variants:3.0" category="configuration"]
  #@config Main configuration file for variants tag 3.0 and the SuperNEMO demonstrator decays generator
  path : string = "@falaise:snemo/demonstrator/decays/variants/3.0/DecaysVariants.conf"
  mime : string = "text/bayeux.datatools.properties"

[urn="urn:snemo:demonstrator:decays:variants:service:3.0" category="configuration"]
  #@config Main configuration file for variants tag 3.0 and the SuperNEMO demonstrator decays generator
  path : string = "@falaise:snemo/demonstrator/decays/variants/service/3.0/DecaysVariantRepository.conf"
  mime : string = "text/bayeux.datatools.properties"

