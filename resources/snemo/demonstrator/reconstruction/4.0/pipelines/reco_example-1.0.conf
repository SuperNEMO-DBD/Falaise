#@description SuperNEMO demonstrator official example reconstruction pipeline for real data
#@key_label  "name"
#@meta_label "type"

[name="flreconstruct" type="flreconstruct::section"]
#@config General parameters section
  
# #@description The maximum number of events to be processed (default=0 : no limit)
# numberOfEvents : integer = 0
  
# #@description The event rate for progression print (default=0 : no print)
# moduloEvents : integer = 0
  
# #@description The user profile (default="normal")
# # Supported values: "normal", "expert", "production"
# userprofile : string = "normal"


[name="flreconstruct.plugins" type="flreconstruct::section"]
#@config Module/plugins load section

#@description List of plugins
 plugins : string[2] = \
    "Falaise_Cimrman" \
    "Falaise_ChargedParticleTracking"


[name="flreconstruct.pipeline" type="flreconstruct::section"]
#@config Pipeline section

#@description The name of the reconstruction processing module to be used as top-level pipeline module (default='pipeline')
module : string = "pipeline"


[name="pipeline" type="dpp::chain_module"]
#@config Top-level pipeline module defined as a chain of several modules
modules : string[4] = \
	"udd2pcd" \
        "pcd2cd"\
	"tracking" \
        "ChargedParticleTracker"


[name="udd2pcd" type="snemo::processing::udd2pcd_module"]
#@config Conversion from UDD to pCD data
  logging.priority : string = "fatal"

  # Input and output banks:
  UDD_label : string = "UDD"
  pCD_label : string = "pCD"

  # Calorimeter signal processing:
  #@description ADC sampling: 2.5 V on 12 bits
  calo_adc2volt : real = 6.103516e-4
  #@description Sampling time : 390.624 ps
  calo_sampling_frequency_ghz : real = 2.56
  calo_postrigger_ns : real = 25.0
  calo_baseline_nsamples : integer = 16
  calo_charge_integration_nsamples : integer = 992
  calo_charge_integration_nsamples_before_peak : integer = 64
  calo_charge_integration_samples_max : integer = 986
  calo_time_cfd_ratio : real = 0.25
  calo_discard_empty_waveform : boolean = true
  calo_method : string = "fwmeas"
  
  # Tracking clustering:
  tracker_method : string = "basic_cluster"
  tracker_method.cluster_radius_threshold : real = 3.0
  tracker_method.cluster_deltat_threshold_us : real as time = 10.0
  tracker_method.cluster_deltat_calo_min_us : real as time = -0.22
  tracker_method.cluster_deltat_calo_max_us : real as time = 5.0


[name="pcd2cd" type="snemo::processing::pcd2cd_module"]
#@config Conversion from pCD to CD data
  logging.priority : string = "fatal"

  # Input and output banks:
  pCD_label : string = "pCD"
  CD_label : string = "CD"

  # Calorimeter calibration:
  calo_energy_method : string = "pol0_table"
  calo_energy_method.database : string = "/sps/nemo/scratch/granjon/full_gain_analysis/Bi/root/compute_a/calibration_phase_2b.txt"
  calo_time_method : string = "t0_table"
  calo_time_method.database : string = "/sps/nemo/scratch/granjon/UDD-2-PTD/calo-t0-fwmeas-manu-v2-normalised.txt"
  tracker_radius_method : string = "manu"  
  tracker_height_method : string = "linear_r5r6"


[name="tracking"  type="Cimrman"]
#@config Cimrman tracking from CD to TCD+TTD data
  verbosity : string = "fatal"

  # Input and output banks:
  CD_label  : string = "CD"
  TCD_label : string = "TCD"
  TTD_label : string = "TTD"
  
  eventrec.electron_mode : string = "polyline"
  eventrec.visualization_2D : boolean = false	
  eventrec.visualization_3D : boolean = false
  eventrec.use_provided_preclustering : boolean = false
  eventrec.reconstruct_alphas : boolean = true
  eventrec.force_default_sigma_r : boolean = true 
  eventrec.default_sigma_r : real as length = 1 mm # 1 um <= s <= 50 mm
  eventrec.chi_square_threshold : real = 5.0
  
  # Clustering:
  clustering.max_distance : real as length = 130.0 mm  # > 44 mm
  clustering.hit_association_distance : real as length = 6.0 mm
  clustering.sinograms.save_sinograms : boolean = false
  clustering.sinograms.iterations : integer = 2
  clustering.sinograms.zoom_factor : real = 10.0
  clustering.sinograms.resolution_phi : integer = 100
  clustering.sinograms.resolution_r : integer = 200
  clustering.sinograms.uncertainty : real as length = 3.0 mm
  clustering.sinograms.max_initial_precision_r : real as length = 6.0 mm

  # Delayed alpha tracking mode:
  alphas.clustering_resolution_phi : integer = 2
  alphas.min_possible_drift_time : real as time = 0 ns  # >= 0 ns
  alphas.max_possible_drift_time : real as time = 5000.0 ns # >= 100 ns
  alphas.time_step : real as time = 50.0 ns # >= 10 ns
  alphas.sinograms.save_sinograms : boolean = false
  alphas.sinograms.iterations : integer = 1
  alphas.sinograms.zoom_factor : real = 10.0
  alphas.sinograms.phi_step : real as angle = 2.0 degree # >= 0.05 degree
  alphas.sinograms.resolution_r : integer = 30
  alphas.sinograms.delta_r : real as length = 60.0 mm # >= 0 mm
  alphas.sinograms.uncertainty : real as length = 2.0 mm # >= 0 mm

  # Polyline tracking mode:
  polylines.max_vertical_distance : real as length = 4.0 mm  # >= 0 mm
  polylines.max_extention_distance : real as length = 120.0 mm  # >= 0 mm
  polylines.max_tracker_hits_distance : real as length = 100.0 mm # >= 0 mm
  polylines.max_kink_angle : real as angle = 120.0 degree # 0 degree <= a <= 180 degree
  polylines.max_trajectories_middlepoint_distance : real as length = 15.0 mm # >= 0 mm
  polylines.max_trajectories_endpoints_distance : real as length = 75.0 mm # >= 0 mm
  polylines.max_trajectories_connection_angle : real as angle = 40.0 degree # 0 degree <= a <= 180 degree
  polylines.min_distance_from_foil : real as length = 75.0 mm # >= 0 mm
  polylines.min_distance_from_main_walls : real as length = 50.0 mm # >= 0 mm
  polylines.min_distance_from_X_walls : real as length = 50.0 mm # >= 0 mm


[name="ChargedParticleTracker" type="snemo::reconstruction::charged_particle_tracking_module"]
#@config Charged particle tracking                                  

  Geo_label : string  = "geometry"

  #@description List of active reconstruction drivers
  drivers : string[4] = "VED" "CCD" "CAD" "AFD"

###################################
# The Vertex Extrapolation Driver #
###################################

  #@description Verbosity
  VED.logging.priority : string = "fatal"

  #@description Length of the initial 'back' step from the end point before extrapolation
  VED.finder.step         : real as length = 2.0 cm

  #@description Distance tolerance for intersection on surface (skin thickness)
  VED.intercept.tolerance : real as length = 1.0 mm

  #@description Maximum extrapolation distance in the horizontal plane for vertex on calorimeter
  VED.max_calo_extrapolation.xy_length   : real as length = 15.0 cm

  #@description Maximum extrapolation distance in the horizontal plane for vertex on source
  VED.max_source_extrapolation.xy_length : real as length = 30.0 cm

  #@description Maximum extrapolation distance in the vertical direction for vertex on source
  VED.max_source_extrapolation.z_length  : real as length = 30.0 cm

  #@description Tolerance on the edge of the calorimeter block entrance surface (horizontal)
  VED.calo_extrapolation.horizontal_tolerance : real as length = 25.0 mm  # default value

  #@description Tolerance on the edge of the calorimeter block entrance surface (vertical)
  VED.calo_extrapolation.vertical_tolerance   : real as length = 30.0 mm  # default value

  #@description Tolerance on the edge of the calibration source carrier (horizontal)
  VED.calibration_source_extrapolation.extend_horizontal : real = 1.0 cm
  
  #@description Tolerance on the edge of the calibration source carrier (vertical)
  VED.calibration_source_extrapolation.extend_vertical   : real = 2.0 cm

  VED.line_extrapolation  : boolean = true # default value
  VED.helix_extrapolation : boolean = false

  #@description Aperture angle for the "conical ray" algorithm for vertex extrapolation on source
  VED.source_extrapolation.cone_angle   : real as angle = 5.0 degree # default value

  #@description Number of rays for the "conical ray" algorithm for vertex extrapolation on source
  VED.source_extrapolation.cone_nrays   : integer = 6 # default value

  #@description Number of layers of ray for the "conical ray" algorithm for vertex extrapolation on source
  VED.source_extrapolation.cone_nlayers : integer = 1 # default value


#############################
# Charge Computation Driver #
#############################

  #@description Verbosity
  CCD.logging.priority : string = "fatal"

  #@description Charge sign convention
  CCD.charge_from_source : boolean = true

  # #@description Magnetic field direction
  # CCD.magnetic_field_direction : string = "+z"


##################################
# Calorimeter Association Driver #
##################################

  #@description Verbosity
  CAD.logging.priority : string = "fatal"

  #@description Maximum matching distance for track/calo association
  CAD.matching_tolerance : real as length = 50 mm

  # #@description Use a simpler approach by looking for geiger cells in front of calo (not implemented yet)
  # CAD.use_last_geiger_cell : boolean = false


#######################
# Alpha Finder Driver #
#######################

  #@description Verbosity
  AFD.logging.priority : string = "fatal"

  #@description Minimal delayed time to consider Geiger hit
  AFD.minimal_delayed_time : real as time = 15 us

  #@description Minimal distance in XY coordinates to associate delayed hit with prompt hit
  AFD.minimal_cluster_xy_search_distance : real as length = 21 cm

  #@description Minimal distance in Z coordinate to associate delayed hit with prompt hit
  AFD.minimal_cluster_z_search_distance : real as length = 30 cm

  #@description Minimal distance between Geiger hit and prompt track extremities
  AFD.minimal_vertex_distance : real as length = 30 cm

    
# end
