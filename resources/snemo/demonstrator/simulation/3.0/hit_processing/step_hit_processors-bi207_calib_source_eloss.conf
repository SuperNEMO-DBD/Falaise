#@description The list of official MC step hit processors for SuperNEMO demonstrator
#@key_label   "name"
#@meta_label  "type"

[name="bi207_calib_source_carrier_frame_eloss.hit_processor" type="snemo::simulation::calorimeter_step_hit_processor"]
  #@variant_section_only geometry:layout/if_basic/source_calibration/is_active|false
  logging.priority      : string  = "fatal"
  hit.category          : string = "bi207_calib_source"
  sensitive.category    : string = "bi207_carrier_frame_SD"
  use_private_pool      : boolean  = 1
  private_pool_capacity : integer  = 20
  cluster.time_range    : real as time   = 1.0 ns
  cluster.space_range   : real as length = 0.5 mm
  mapping.category      : string = "source_calibration_frame"


[name="bi207_calib_source_carrier_frame_eloss.visu.hit_processor" type="mctools::push_all_step_hit_processor"]
  #@variant_section_only geometry:layout/if_basic/source_calibration/is_active|false
  #@config The step hit processor for collecting the 'bi207_calib_source' simulated hits
  # The truth hits collected from the 'source_calibration_frame' volumes by the 'bi207_carrier_frame_SD'
  # sensitive detector are pushed without modification in the '__visu.tracks'
  # collection. 
  logging.priority   : string  = "error"
  sensitive.category : string  = "bi207_carrier_frame_SD"
  hit.category       : string  = "__visu.tracks"
  output_profiles.matching : string[2] = "source_details" "all_details"


