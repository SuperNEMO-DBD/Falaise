#@description A list of vertex generators
#@key_label   "name"
#@meta_label  "type"

[name="real_snrs1_source_strip_itep_pad_bulk_test" type="snrs::mesh_pad_vg"]
#@config Vertex generation from bulk of the SuperNEMO source strip X pad 0;group=SourceFoilRealistic/SNRS1;rank=second

logging.priority : string = "debug"

#@description Geometry version requirement (not working with version lower than 5.0)
geometry.setup_requirement : string = "snemo::demonstrator(>=5)"
origin         : string = " category='source_pad' module={0} strip={3} pad={0} "
mode           : string = "bulk"
skin_thickness : real as length = 1 um

# TEST
tiles.min_row    : integer = 50
tiles.max_row    : integer = 51
tiles.min_column : integer = 4
tiles.max_column : integer = 6
debug.fixed_vertex_on_tile : boolean = false
debug.draw_tiles     : boolean = true

# end