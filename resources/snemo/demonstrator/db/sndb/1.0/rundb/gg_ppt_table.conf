#@description A list of descriptions for DB tracker cell PPT table (Plasma Propagation Time)
#@key_label  "name"
#@meta_label "type"


#####################################################################
[name="GgPptTypeFieldDesc" type="field_description"]

type       : string = "var_char"
max_length : integer = 32


#####################################################################
[name="GgPptValueFieldDesc" type="field_description"]

type       : string = "real"
unsigned   : boolean = true


#####################################################################
[name="GgPptValueErrorFieldDesc" type="field_description"]

type       : string = "real"
unsigned   : boolean = true



#####################################################################
[name="GgStatusChangeEventsTableDesc" type="table_description"]

fields : string[7] = \
  "id" \
  "cell_num" \
  "start_time" \
  "stop_time" \
  "ppt_type" \
  "ppt" \
  "ppt_error"

fields.id.comment : string = "record_id"
fields.id.model   : string = "PrimaryIntKeyFieldDesc"

fields.cell_num.comment : string = "Cell number"
fields.cell_num.model   : string = "GgNumberFieldDesc"

fields.begin_timestamp.comment : string = "Event timestamp"
fields.begin_timestamp.model   : string = "DateTimeFieldDesc"

fields.end_timestamp.comment : string = "Event timestamp"
fields.end_timestamp.model   : string = "DateTimeFieldDesc"

fields.ppt_type.comment : string = "Geiger cell PPT type"
fields.ppt_type.model   : string = "GgPptTypeFieldDesc"

fields.ppt.comment : string = "Geiger cell PPT value (nanosecond)"
fields.ppt.model   : string = "GgPptValueFieldDesc"

fields.ppt_error.comment : string = "Geiger cell PPT uncertainty value (nanosecond)"
fields.ppt_error.model   : string = "GgPptErrorValueFieldDesc"

