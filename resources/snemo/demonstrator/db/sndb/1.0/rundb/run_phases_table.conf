fields.stop_time.null_allowed : boolean = true

fields.status.text  : string = "Phase status bits"
fields.status.model : string = "StatusBit16FieldDesc"

fields.comment.text         : string = "Optional comment"
fields.comment.model        : string = "CommentFieldDesc"
fields.comment.null_allowed : boolean = true


