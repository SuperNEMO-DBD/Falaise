#####################################################################
[name="RunPhaseNumberFieldDesc" type="field_description"]
#config The ID of a run phase
type       : string = "integer"
unsigned   : boolean = true
max_length : integer = 10


#####################################################################
[name="RunPhasesTableDesc" type="table_description"]
#config The table describing run phases

fields : string[5] = \
  "phase_id" \
  "start_time" \
  "stop_time" \
  "status" \
  "comment" 

fields.phase_id.text        : string = "Unique phase ID"
fields.phase_id.model       : string = "RunPhaseNumberFieldDesc"
